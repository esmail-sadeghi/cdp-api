spring:
  application:
    name: cdp-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/appdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: cdp_api_flyway_history
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "CDP API schema"

oss-inventory:
  base-url: ${OSS_INVENTORY_BASE_URL:https://192.168.96.154}

trunk:
  sync:
    cron: ${TRUNK_SYNC_CRON:0 0 7 * * *}
    zone: ${TRUNK_SYNC_ZONE:Asia/Tehran}

logging:
  level:
    com.fwutech.oss.cdpapi: INFO
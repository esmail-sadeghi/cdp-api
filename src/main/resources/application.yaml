server:
  port: ${SERVER_PORT:5052}

spring:
  application:
    name: cdp-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/appdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: cdp_api_flyway_history
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "CDP API schema"

oss-inventory:
  base-url: ${OSS_INVENTORY_BASE_URL:https://192.168.96.154}

trunk:
  sync:
    cron: ${TRUNK_SYNC_CRON:0 0 7 * * *}
    zone: ${TRUNK_SYNC_ZONE:Asia/Tehran}

cdp:
  clickhouse:
    url: ${CLICKHOUSE_URL:jdbc:ch:http://127.0.0.1:8123/cdr}
    host: ${CLICKHOUSE_HOST:127.0.0.1}
    port: ${CLICKHOUSE_PORT:8123}
    database: ${CLICKHOUSE_DATABASE:cdr}
    username: ${CLICKHOUSE_USERNAME:cdr}
    password: ${CLICKHOUSE_PASSWORD:Ck123456}
    driver-class-name: ${CLICKHOUSE_DRIVER:com.clickhouse.jdbc.ClickHouseDriver}

  pagination:
    default-page-size: ${CDP_API_DEFAULT_PAGE_SIZE:50}
    max-page-size: ${CDP_API_MAX_PAGE_SIZE:1000}

logging:
  level:
    com.fwutech.oss.cdpapi: INFO
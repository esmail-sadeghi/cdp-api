server:
  port: ${SERVER_PORT:5052}

spring:
  application:
    name: cdp-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.106.45:5432/cdp}
    username: ${DB_USERNAME:cdp_app}
    password: ${DB_PASSWORD:30Dp@Pp$Ti30}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 300000
      idle-timeout: 120000
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: cdp_app
        jdbc:
          time_zone: UTC

cdp:
  clickhouse:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://192.168.106.45:8123/cdp_repo}
    host: ${CLICKHOUSE_HOST:192.168.106.45}
    port: ${CLICKHOUSE_PORT:8123}
    database: ${CLICKHOUSE_DATABASE:cdp_repo}
    username: ${CLICKHOUSE_USERNAME:cdp_repo}
    password: ${CLICKHOUSE_PASSWORD:30Dp@Pp$Ti30}
    driver-class-name: ${CLICKHOUSE_DRIVER:com.clickhouse.jdbc.ClickHouseDriver}

  pagination:
    default-page-size: ${CDP_API_DEFAULT_PAGE_SIZE:50}
    max-page-size: ${CDP_API_MAX_PAGE_SIZE:1000}

logging:
  level:
    com.fwutech.oss.cdpapi: INFO